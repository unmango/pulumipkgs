name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      build-all: ${{ steps.list.outputs.build-all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: list
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "build-all=true" >> "$GITHUB_OUTPUT"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")

          if echo "$changed" | grep -qvE '^pkgs/(plugins|components)/'; then
            echo "build-all=true" >> "$GITHUB_OUTPUT"
            echo "packages=[]" >> "$GITHUB_OUTPUT"
          else
            names=$(echo "$changed" \
              | grep -E '^pkgs/(plugins|components)/' \
              | cut -d/ -f3 \
              | sort -u \
              | jq -R . \
              | jq -sc .)
            echo "build-all=false" >> "$GITHUB_OUTPUT"
            echo "packages=$names" >> "$GITHUB_OUTPUT"
          fi

  build-changed:
    needs: changed
    if: needs.changed.outputs.build-all == 'false' && needs.changed.outputs.packages != '[]'
    runs-on: thecluster
    strategy:
      matrix:
        package: ${{ fromJson(needs.changed.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@835764fe9da2700f7faf29d3455712ea3f054d6b # setup-nix-use-daemon
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_name: unmango
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # cachix-action's post-build hook has no shebang at byte 0 and fails with
          # "Exec format error" under this runner's Nix.
          use_daemon: false

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - run: nix build ".#pulumiPackages.${{ matrix.package }}" -L

  build-all:
    needs: changed
    if: needs.changed.outputs.build-all == 'true'
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@835764fe9da2700f7faf29d3455712ea3f054d6b # setup-nix-use-daemon
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_name: unmango
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # cachix-action's post-build hook has no shebang at byte 0 and fails with
          # "Exec format error" under this runner's Nix.
          use_daemon: false

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - run: nix flake check -L

  build:
    needs: [changed, build-changed, build-all]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          results=(
            "${{ needs.changed.result }}"
            "${{ needs.build-changed.result }}"
            "${{ needs.build-all.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "A required job did not succeed: $r"
              exit 1
            fi
          done
