name: Update

on:
  schedule:
    # Every 6 hours: comfortably inside the 24h freshness target (docs/spec.md §7)
    # after accounting for typical PR review latency.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: DeterminateSystems/nix-installer-action@cd46bde16ab981b0a7b2dce0574509104543276e # v9

      - run: nix profile install nixpkgs#nix-update nixpkgs#jq nixpkgs#gh

      - name: Run update automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: pulumipkgs-bot
          GIT_AUTHOR_EMAIL: pulumipkgs-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: pulumipkgs-bot
          GIT_COMMITTER_EMAIL: pulumipkgs-bot@users.noreply.github.com
        run: ./scripts/update.sh
