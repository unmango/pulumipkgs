name: Update

on:
  schedule:
    # Every 6 hours: comfortably inside the 24h freshness target (docs/spec.md §7)
    # after accounting for typical PR review latency.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run update automation
        env:
          # Commits are created through the GitHub API (createCommitOnBranch),
          # so they are attributed to the token identity and signed by GitHub;
          # no git author/committer configuration is needed.
          #
          # A PAT rather than GITHUB_TOKEN: main's ruleset requires an extra
          # approval for unattributed changes and a passing `build` check, and
          # GITHUB_TOKEN satisfies neither (its commits belong to the Actions
          # bot, and the pull requests it opens do not trigger workflows).
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: nix develop -c ./scripts/update.sh
