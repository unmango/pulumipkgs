name: Update

on:
  schedule:
    # Every 6 hours: comfortably inside the 24h freshness target (docs/spec.md §7)
    # after accounting for typical PR review latency.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      - name: Run update automation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: pulumipkgs-bot
          GIT_AUTHOR_EMAIL: pulumipkgs-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: pulumipkgs-bot
          GIT_COMMITTER_EMAIL: pulumipkgs-bot@users.noreply.github.com
        run: nix develop -c ./scripts/update.sh
